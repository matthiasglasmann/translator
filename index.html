<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>VKL Übersetzer</title>

<!-- iOS Safari: Add to Home Screen als Standalone-App -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="VKL Übersetzer" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />

<!-- Android/Chrome/Desktop -->
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<meta name="theme-color" content="#0f172a" />

<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #020617;
    color: #f8fafc;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 14px 16px;
    border-bottom: 1px solid #1e293b;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  h1 { font-size: 17px; font-weight: 600; margin: 0; white-space: nowrap; }
  .inputRow { flex: 1; display: flex; gap: 8px; min-width: 240px; }
  textarea {
    flex: 1;
    resize: none;
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 8px;
    color: #f8fafc;
    padding: 10px 12px;
    font-size: 16px;
    font-family: inherit;
  }
  textarea:focus { outline: 2px solid #0ea5e9; }
  button {
    border: none;
    border-radius: 8px;
    font-family: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-primary { background: #0369a1; color: white; padding: 0 18px; font-size: 15px; }
  .btn-primary:disabled { background: #1e293b; color: #64748b; cursor: default; }
  .icon-btn {
    background: transparent; border: 1px solid #334155; color: #cbd5e1;
    width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; font-size: 18px;
  }
  .icon-btn:hover { background: #1e293b; }
  main { flex: 1; padding: 14px; }

  .langToggleRow { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .langChip {
    display: flex; align-items: center; gap: 6px;
    background: #0f172a; border: 1px solid #334155; border-radius: 999px;
    padding: 6px 12px; font-size: 13px; cursor: pointer; user-select: none;
  }
  .langChip.active { border-color: var(--accent); background: #10203a; }
  .langChip input { accent-color: var(--accent, #0ea5e9); }

  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
  .card {
    background: #0f172a; border-left: 4px solid var(--accent, #0ea5e9); border-radius: 8px;
    padding: 16px; min-height: 110px; display: flex; flex-direction: column;
  }
  .lang-label { font-size: 13px; color: #94a3b8; margin-bottom: 6px; font-weight: 500; }
  .translation { font-size: 22px; font-weight: 600; line-height: 1.3; flex: 1; }
  .placeholder { color: #475569; }
  .empty-hint { color: #64748b; padding: 24px 4px; }
  .error { background: #450a0a; color: #fca5a5; padding: 10px 16px; font-size: 14px; }
  body.project-mode header .app-title,
  body.project-mode .icon-btn.settings,
  body.project-mode .langToggleRow { display: none; }
  body.project-mode .translation { font-size: 34px; }

  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,.65);
    display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px;
  }
  .modal {
    background: #0f172a; border: 1px solid #334155; border-radius: 12px;
    padding: 20px; width: 100%; max-width: 460px; max-height: 85vh; overflow-y: auto;
  }
  .modal h2 { margin: 0 0 4px; font-size: 17px; }
  .modal-close { float: right; background: none; border: none; color: #94a3b8; font-size: 20px; cursor: pointer; }
  .lang-item, .hist-item {
    display: flex; justify-content: space-between; align-items: center;
    background: #1e293b; border-radius: 6px; padding: 8px 10px; margin-bottom: 6px; font-size: 14px; gap: 8px;
  }
  .lang-item .meta { display: flex; gap: 8px; align-items: baseline; overflow: hidden; }
  .lang-item .code { color: #64748b; font-size: 12px; font-family: ui-monospace, monospace; }
  .lang-item button { background: none; border: none; color: #64748b; cursor: pointer; font-size: 15px; flex-shrink: 0; }
  input[type=text], input[type=number] {
    background: #1e293b; border: 1px solid #334155; border-radius: 6px;
    color: #f8fafc; padding: 8px 10px; font-size: 14px; font-family: inherit; width: 100%;
  }
  .row { display: flex; gap: 8px; margin-top: 10px; }
  .row input { flex: 1; }
  .hint { font-size: 12px; color: #64748b; margin-top: 4px; }
  .hist-entry { margin-bottom: 14px; padding-bottom: 14px; border-bottom: 1px solid #1e293b; }
  .hist-time { font-size: 11px; color: #64748b; margin-bottom: 4px; }
  .hist-source { font-size: 14px; color: #cbd5e1; margin-bottom: 6px; }
  .hist-trans { font-size: 13px; color: #94a3b8; }
  label { font-size: 13px; color: #cbd5e1; display: block; margin-top: 16px; margin-bottom: 4px; }
</style>
</head>
<body>

<header>
  <h1 class="app-title">VKL Übersetzer</h1>
  <div class="inputRow">
    <textarea id="input" rows="1" placeholder="Text eingeben … (Enter = übersetzen, Umschalt+Enter = Zeilenumbruch)"></textarea>
    <button class="btn-primary" id="sendBtn">Senden</button>
  </div>
  <button class="icon-btn" id="historyBtn" title="Historie">🕘</button>
  <button class="icon-btn settings" id="settingsBtn" title="Einstellungen">⚙️</button>
  <button class="icon-btn" id="projectBtn" title="Projektionsmodus">🖥️</button>
</header>

<div id="errorBox" class="error" style="display:none;"></div>

<main>
  <div class="langToggleRow" id="langToggleRow"></div>
  <div class="grid" id="grid"></div>
</main>

<!-- Settings Modal -->
<div class="modal-backdrop" id="settingsModal" style="display:none;">
  <div class="modal">
    <button class="modal-close" id="closeSettings">✕</button>
    <h2>Einstellungen</h2>

    <label>Proxy-URL (Cloudflare Worker)</label>
    <input type="text" id="proxyUrl" placeholder="https://dein-worker.workers.dev" />
    <div class="hint">Einmalig einrichten, siehe Anleitung.</div>

    <label>Sprachen-Merkliste (max. 8) — pro Übersetzung oben per Klick aktivieren</label>
    <div id="langList"></div>
    <div class="row">
      <input type="text" id="newLangName" placeholder="Anzeigename, z. B. Somali" />
      <input type="text" id="newLangCode" placeholder="Code, z. B. so" style="max-width:90px;" />
      <button class="btn-primary" id="addLangBtn" style="padding:0 14px;">+</button>
    </div>
    <div class="hint">Sprachcodes: developers.microsoft.com/de-de/... → Translator → Language support</div>

    <label>Historie: Anzahl gespeicherter Einträge</label>
    <input type="number" id="histLimit" min="0" max="500" step="10" />
    <div class="hint">0 = keine Historie speichern.</div>
  </div>
</div>

<!-- History Modal -->
<div class="modal-backdrop" id="historyModal" style="display:none;">
  <div class="modal">
    <button class="modal-close" id="closeHistory">✕</button>
    <h2>Historie</h2>
    <button class="btn-primary" id="clearHistoryBtn" style="padding:8px 14px; margin: 14px 0;">Historie löschen</button>
    <div id="historyList"></div>
  </div>
</div>

<script>
const DEFAULT_POOL = [
  { name: "Ukrainisch", code: "uk" },
  { name: "Arabisch",   code: "ar" },
  { name: "Türkisch",   code: "tr" },
  { name: "Farsi",      code: "fa" },
  { name: "Dari",       code: "prs" },
  { name: "Englisch",   code: "en" },
  { name: "Tigrinya",   code: "ti" },
  { name: "Somali",     code: "so" },
];
const DEFAULT_ACTIVE = ["uk", "ar", "tr", "fa"];
const ACCENTS = ["#f59e0b", "#0ea5e9", "#f43f5e", "#10b981", "#8b5cf6", "#fb923c", "#eab308", "#06b6d4"];

let pool = JSON.parse(localStorage.getItem("vkl_pool") || "null") || DEFAULT_POOL.slice();
let active = JSON.parse(localStorage.getItem("vkl_active") || "null") || DEFAULT_ACTIVE.slice();
let proxyUrl = localStorage.getItem("vkl_proxy_url") || "";
let histLimit = parseInt(localStorage.getItem("vkl_hist_limit") || "50", 10);
let history = JSON.parse(localStorage.getItem("vkl_history") || "[]");
let currentTranslations = {}; // code -> text
let projectMode = false;

const $ = (id) => document.getElementById(id);
const input = $("input");
const grid = $("grid");
const errorBox = $("errorBox");

function autoGrow() {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 140) + "px";
}
input.addEventListener("input", autoGrow);

function saveActive() { localStorage.setItem("vkl_active", JSON.stringify(active)); }
function savePool() { localStorage.setItem("vkl_pool", JSON.stringify(pool)); }

function renderLangToggles() {
  const el = $("langToggleRow");
  el.innerHTML = "";
  pool.forEach((l, i) => {
    const chip = document.createElement("label");
    chip.className = "langChip" + (active.includes(l.code) ? " active" : "");
    chip.style.setProperty("--accent", ACCENTS[i % ACCENTS.length]);
    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = active.includes(l.code);
    cb.addEventListener("change", () => {
      if (cb.checked) { if (!active.includes(l.code)) active.push(l.code); }
      else { active = active.filter((c) => c !== l.code); }
      saveActive();
      renderLangToggles();
      renderGrid();
    });
    chip.appendChild(cb);
    chip.appendChild(document.createTextNode(l.name));
    el.appendChild(chip);
  });
}

function renderGrid() {
  grid.innerHTML = "";
  const activeLangs = pool.filter((l) => active.includes(l.code));
  if (activeLangs.length === 0) {
    grid.innerHTML = '<div class="empty-hint">Keine Sprache aktiv. Oben mindestens eine auswählen.</div>';
    return;
  }
  activeLangs.forEach((lang, i) => {
    const card = document.createElement("div");
    card.className = "card";
    card.style.setProperty("--accent", ACCENTS[pool.indexOf(lang) % ACCENTS.length]);
    const label = document.createElement("div");
    label.className = "lang-label";
    label.textContent = lang.name;
    const trans = document.createElement("div");
    trans.className = "translation";
    const val = currentTranslations[lang.code];
    if (val) { trans.textContent = val; }
    else { trans.textContent = "—"; trans.classList.add("placeholder"); }
    card.appendChild(label);
    card.appendChild(trans);
    grid.appendChild(card);
  });
}

function showError(msg) {
  errorBox.textContent = msg;
  errorBox.style.display = msg ? "block" : "none";
}

async function translateAll(text) {
  const codes = active.slice();
  if (codes.length === 0) { showError("Keine Zielsprache aktiv."); return; }
  if (!proxyUrl) { showError("Keine Proxy-URL eingestellt. Bitte in den Einstellungen (⚙️) hinterlegen."); return; }
  showError("");
  const btn = $("sendBtn");
  btn.disabled = true;
  btn.textContent = "…";
  try {
    const res = await fetch(proxyUrl, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text, codes }),
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    currentTranslations = data.translations || {};
    renderGrid();
    if (histLimit > 0) {
      const named = {};
      pool.filter((l) => active.includes(l.code)).forEach((l) => { named[l.name] = currentTranslations[l.code]; });
      history.unshift({ time: new Date().toISOString(), text, translations: named });
      history = history.slice(0, histLimit);
      localStorage.setItem("vkl_history", JSON.stringify(history));
    }
  } catch (e) {
    showError("Übersetzung fehlgeschlagen: " + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = "Senden";
  }
}

$("sendBtn").addEventListener("click", () => {
  const text = input.value.trim();
  if (!text) return;
  translateAll(text);
});
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("sendBtn").click(); }
});

// Settings: language pool management
function renderLangList() {
  const el = $("langList");
  el.innerHTML = "";
  pool.forEach((l) => {
    const row = document.createElement("div");
    row.className = "lang-item";
    const meta = document.createElement("div");
    meta.className = "meta";
    meta.innerHTML = `<span>${l.name}</span><span class="code">${l.code}</span>`;
    const del = document.createElement("button");
    del.textContent = "✕";
    del.addEventListener("click", () => {
      pool = pool.filter((x) => x.code !== l.code);
      active = active.filter((c) => c !== l.code);
      savePool(); saveActive();
      renderLangList(); renderLangToggles(); renderGrid();
    });
    row.appendChild(meta);
    row.appendChild(del);
    el.appendChild(row);
  });
}

$("addLangBtn").addEventListener("click", () => {
  const name = $("newLangName").value.trim();
  const code = $("newLangCode").value.trim();
  if (name && code && !pool.some((l) => l.code === code) && pool.length < 8) {
    pool.push({ name, code });
    savePool();
    $("newLangName").value = ""; $("newLangCode").value = "";
    renderLangList(); renderLangToggles(); renderGrid();
  }
});

$("settingsBtn").addEventListener("click", () => {
  $("proxyUrl").value = proxyUrl;
  $("histLimit").value = histLimit;
  renderLangList();
  $("settingsModal").style.display = "flex";
});
$("closeSettings").addEventListener("click", () => {
  proxyUrl = $("proxyUrl").value.trim();
  localStorage.setItem("vkl_proxy_url", proxyUrl);
  histLimit = parseInt($("histLimit").value, 10) || 0;
  localStorage.setItem("vkl_hist_limit", histLimit);
  $("settingsModal").style.display = "none";
});

// History
function renderHistory() {
  const el = $("historyList");
  el.innerHTML = "";
  if (history.length === 0) { el.innerHTML = '<div class="hint">Noch keine Einträge.</div>'; return; }
  history.forEach((h) => {
    const div = document.createElement("div");
    div.className = "hist-entry";
    const time = new Date(h.time).toLocaleString("de-DE");
    const transStr = Object.entries(h.translations).map(([k, v]) => `${k}: ${v}`).join(" · ");
    div.innerHTML = `<div class="hist-time">${time}</div><div class="hist-source">${h.text}</div><div class="hist-trans">${transStr}</div>`;
    el.appendChild(div);
  });
}
$("historyBtn").addEventListener("click", () => { renderHistory(); $("historyModal").style.display = "flex"; });
$("closeHistory").addEventListener("click", () => $("historyModal").style.display = "none");
$("clearHistoryBtn").addEventListener("click", () => {
  history = [];
  localStorage.setItem("vkl_history", "[]");
  renderHistory();
});

// Projection mode
$("projectBtn").addEventListener("click", () => {
  projectMode = !projectMode;
  document.body.classList.toggle("project-mode", projectMode);
});

renderLangToggles();
renderGrid();
</script>
</body>
</html>
